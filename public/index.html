<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f5c4a">
  <meta name="description" content="Ask out loud, in Kannada, Hindi or English, which documents to carry for a government service in Karnataka.">
  <title>DocAgent Voice</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%230f5c4a%22/%3E%3Cpath fill=%22%23fff%22 d=%22M12 14a2.5 2.5 0 0 0 2.5-2.5v-5a2.5 2.5 0 1 0-5 0v5A2.5 2.5 0 0 0 12 14Zm4.2-2.5a4.2 4.2 0 0 1-8.4 0H6.3a5.7 5.7 0 0 0 5 5.6V19h1.4v-1.9a5.7 5.7 0 0 0 5-5.6h-1.5Z%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
      </span>
      <h1 id="title">DocAgent Voice</h1>
    </div>
    <nav class="langs" id="langs" aria-label="Language"></nav>
  </header>

  <main class="wrap">
    <p class="tagline" id="tagline"></p>
    <div class="banner" id="banner" role="status" hidden></div>

    <section class="talk" aria-live="polite">
      <p class="heard" id="heard" hidden></p>
      <div class="reply">
        <p id="reply"></p>
        <button class="icon-btn" id="replay" type="button" aria-label="Say it again">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3Zm13.5 2A4.5 4.5 0 0 0 14 8v8a4.47 4.47 0 0 0 2.5-4ZM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54Z"/></svg>
        </button>
      </div>
    </section>

    <section class="mic-area">
      <button class="mic" id="mic" type="button" aria-label="Tap to speak" aria-pressed="false" aria-keyshortcuts="Space">
        <span class="pulse" aria-hidden="true"></span>
        <svg viewBox="0 0 24 24" width="48" height="48" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
      </button>
      <p class="mic-label" id="micLabel" aria-hidden="true"></p>
      <div class="chips" id="chips"></div>
      <form class="typebox" id="typebox" autocomplete="off">
        <input id="typed" type="text" inputmode="text" aria-label="Type">
        <button type="submit" id="sendBtn"></button>
      </form>
      <details class="access" id="access">
        <summary>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2Z"/></svg>
          <span id="accessTitle"></span>
        </summary>
        <div class="access-body">
          <label class="toggle"><input type="checkbox" id="optSpeak"> <span id="optSpeakLabel"></span></label>
          <label class="toggle"><input type="checkbox" id="optSlow"> <span id="optSlowLabel"></span></label>
          <label class="toggle"><input type="checkbox" id="handsFree"> <span id="handsFreeLabel"></span></label>
          <label class="toggle"><input type="checkbox" id="optLarge"> <span id="optLargeLabel"></span></label>
          <label class="toggle"><input type="checkbox" id="optContrast"> <span id="optContrastLabel"></span></label>
          <p class="access-note" id="accessNote"></p>
        </div>
      </details>
    </section>

    <section class="panel summary" id="summary" hidden>
      <ul class="facts" id="facts"></ul>
      <div class="actions">
        <a class="btn whatsapp" id="whatsapp" href="#" target="_blank" rel="noopener"></a>
        <button class="btn ghost" id="restart" type="button"></button>
      </div>
    </section>

    <section class="panel" id="checklist" hidden>
      <div class="panel-head">
        <h2 id="checklistTitle"></h2>
        <span class="count" id="count"></span>
      </div>
      <p class="service-name" id="serviceName"></p>
      <ol class="items" id="items"></ol>
      <details class="official">
        <summary id="officialLabel"></summary>
        <p id="officialText"></p>
      </details>
    </section>

    <p class="privacy" id="privacy"></p>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
